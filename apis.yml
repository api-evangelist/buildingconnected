aid: buildingconnected
name: Buildingconnected
description: >-
  BuildingConnected is a preconstruction and bid-management platform for the commercial
  construction industry, now part of Autodesk Construction Cloud. Its products — Bid Board
  Pro for general contractors and subcontractors, and TradeTapp for subcontractor risk
  qualification — help teams send, track, and manage bid invitations across the largest
  construction network in North America. Autodesk acquired BuildingConnected in 2018, and
  its data is accessible programmatically through the BuildingConnected API on Autodesk
  Platform Services (APS), a REST API secured with Autodesk's OAuth 2.0 (two-legged and
  three-legged) authentication and versioned under a /v2 URI path.
